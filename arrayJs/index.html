<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <title>Generatore Numeri in Griglia Ordinata</title>

 <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f6d1ff, #c79bff);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }

    button {
      background: #b43cff;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #8b27d6;
      transform: scale(1.03);
    }

    h1 {
      margin-bottom: 20px;
      color: #4a1e7a;
    }

    h2, h3 {
      margin-bottom: 5px;
      color: #5a2d91;
    }

    #vettore, #griglia {
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      gap: 6px;
      background: #ffffff;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(120, 20, 200, 0.2);
      margin-top: 10px;
      width: 90%;
      max-width: 900px;
      text-align: center;
      font-family: monospace;
      font-size: 14px;
      line-height: 1.8;
      word-wrap: break-word;
      color: #4a1e7a;
    }

    #vettore span, #griglia span {
      display: inline-block;
      padding: 6px 8px;
      border: 1px solid #d7c4f7;
      border-radius: 6px;
      background: #f6eeff;
      transition: 0.2s;
    }

    #vettore span:hover, #griglia span:hover {
      background: #e7d1ff;
      transform: scale(1.05);
    }

    #vettore span.alta, #griglia span.alta {
      background: #e2ffd9;
      border-color: #78d65d;
    }

    #vettore span.negativo {
      background: #ffd6e5;
      border-color: #ff4f8b;
    }

    .stats {
      background: #ffffff;
      padding: 10px 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(100, 0, 150, 0.15);
      margin-top: 15px;
      color: #4a1e7a;
    }
</style>

</head>

<body>
  <h1>Generatore di Numeri Casuali</h1>

  <button type="button" onclick="generaNumeri()">Genera Numeri</button>

  <div class="stats">
    <h2>Statistiche</h2>
    <p><strong>Media:</strong> <span id="media"></span></p>
    <p><strong>Massimo:</strong> <span id="max"></span></p>
    <p><strong>Minimo:</strong> <span id="min"></span></p>
  </div>

  <h3>Vettore completo:</h3>
  <div id="vettore"></div>

  <h3>Numeri > 50:</h3>
  <div id="griglia"></div>

  <script src="codice.js"></script>
</body>
</html>
